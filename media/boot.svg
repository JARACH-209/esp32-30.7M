<g class="w"><text class="ln l0"><tspan x="22.0" y="64.0" fill="#4dd0e1">=== stories42M on ESP32-S3 :: dense record run ===</tspan></text><text class="ln l1"><tspan x="22.0" y="83.0" fill="#6b7a8c">model: </tspan><tspan x="76.7" y="83.0" fill="#c9d5e1">dim=512 hid=1408 L=8 H=8 kv=8 V=10600 (of 32000) seq=192</tspan></text><text class="ln l2"><tspan x="22.0" y="102.0" fill="#6b7a8c">pack : </tspan><tspan x="76.7" y="102.0" fill="#c9d5e1">15.36 MB mapped | core Q4 + table Q4 g128</tspan></text><text class="ln l3"><tspan x="22.0" y="121.0" fill="#6b7a8c">build: </tspan><tspan x="76.7" y="121.0" fill="#c9d5e1">bytes=16101008 </tspan><tspan x="193.9" y="121.0" fill="#d2a8ff">fp=8af5c5fe</tspan><tspan x="279.8" y="121.0" fill="#6b7a8c"> | </tspan><tspan x="303.3" y="121.0" fill="#ffb454">~30.72M params</tspan><tspan x="412.7" y="121.0" fill="#c9d5e1">, all dense-multiplied per token</tspan></text><text class="ln l4"><tspan x="22.0" y="140.0" fill="#6b7a8c">staged table -&gt; PSRAM (2.67 MB)</tspan></text><text class="ln l5"><tspan x="22.0" y="159.0" fill="#6b7a8c">staged 1/8 core layers -&gt; PSRAM</tspan></text><text class="ln l6"><tspan x="22.0" y="178.0" fill="#6b7a8c">config: dual_core=1 display=1 kv16=1 seq=192</tspan></text><text class="ln l8"><tspan x="22.0" y="216.0" fill="#ffb454">&gt;&gt;&gt; </tspan><tspan x="53.3" y="216.0" fill="#7ee787">Once upon a time, there was a little hanger. The hanger</tspan></text><text class="ln l9"><tspan x="22.0" y="235.0" fill="#7ee787">was sad because it could not hang things like other hangers.</tspan></text><text class="ln l10"><tspan x="22.0" y="254.0" fill="#7ee787">It felt ashamed because it was not as strong as the others.</tspan></text><text class="ln l11"><tspan x="22.0" y="273.0" fill="#7ee787">One day, a little monkey named Mia came to the wardrobe and</tspan></text><text class="ln l12"><tspan x="22.0" y="292.0" fill="#7ee787">said, "Why are you sad, hanger?"</tspan></text><text class="ln l13"><tspan x="22.0" y="311.0" fill="#7ee787">From that day on, the hanger was not ashamed anymore, and the</tspan></text><text class="ln l14"><tspan x="22.0" y="330.0" fill="#7ee787">hanger was proud to have true friends.</tspan></text><text class="ln l16"><tspan x="22.0" y="368.0" fill="#6b7a8c">--- </tspan><tspan x="53.3" y="368.0" fill="#c9d5e1">191 tokens</tspan><tspan x="131.4" y="368.0" fill="#6b7a8c"> | </tspan><tspan x="154.8" y="368.0" fill="#c9d5e1">201.8 s</tspan><tspan x="209.5" y="368.0" fill="#6b7a8c"> | </tspan><tspan x="233.0" y="368.0" fill="#ffb454">0.95 tok/s</tspan><tspan x="311.1" y="368.0" fill="#6b7a8c"> | </tspan><tspan x="334.5" y="368.0" fill="#ffb454">30.72M params dense</tspan><tspan x="483.0" y="368.0" fill="#6b7a8c"> ---</tspan></text><rect class="ln l16 cur" x="517.2" y="358.0" width="7.8" height="13" /></g>
